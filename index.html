<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turin OS - Futuristic POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050505; --panel: rgba(20, 20, 25, 0.7); --glass: rgba(255, 255, 255, 0.05);
  --text: #ffffff; --muted: #888888; --brand: #00ffcc; --brand-hover: #00ccaa;
  --accent: #ff0055; --border: rgba(255, 255, 255, 0.1); --radius: 16px;
  --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
body { margin: 0; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; background-image: radial-gradient(circle at 15% 50%, rgba(0, 255, 204, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(255, 0, 85, 0.08), transparent 25%); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: white; }
input, select { font-family: inherit; width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; background: rgba(0,0,0,0.5); color: var(--text); font-size: 14px; margin-bottom: 12px; transition: 0.2s; }
input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 10px rgba(0, 255, 204, 0.2); }

/* Layout */
.sidebar { width: 260px; background: var(--panel); backdrop-filter: blur(20px); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 16px; z-index: 10; }
.logo { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 40px; color: var(--brand); text-shadow: 0 0 15px rgba(0,255,204,0.5); letter-spacing: 2px; }
.nav-btn { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; color: var(--muted); font-weight: 600; transition: 0.2s; margin-bottom: 8px; width: 100%; text-align: left; }
.nav-btn:hover { background: var(--glass); color: white; }
.nav-btn.active { background: var(--brand); color: black; box-shadow: 0 0 20px rgba(0, 255, 204, 0.3); }
.nav-btn span { font-size: 18px; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
header { padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--panel); backdrop-filter: blur(10px); }
header h1 { margin: 0; font-size: 20px; font-family: 'Space Grotesk', sans-serif; }
.user-badge { background: var(--glass); padding: 8px 16px; border-radius: 20px; font-size: 13px; border: 1px solid var(--border); }
.content { padding: 32px; overflow-y: auto; flex: 1; position: relative; }

/* POS */
.pos-container { display: grid; grid-template-columns: 1fr 380px; gap: 24px; height: 100%; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.card-prod { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; min-height: 130px; backdrop-filter: blur(10px); transition: 0.2s; }
.card-prod:hover { border-color: var(--brand); transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,255,204,0.1); }
.card-prod h3 { margin: 0 0 8px 0; font-size: 15px; font-weight: 600; color: white; }
.card-prod .price { color: var(--brand); font-weight: 800; font-size: 18px; }
.cart-area { background: var(--panel); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; }
.cart-items { flex: 1; overflow-y: auto; padding: 20px; }
.cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.qty-controls { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.3); border-radius: 20px; padding: 4px; border: 1px solid var(--border); }
.qty-controls button { width: 28px; height: 28px; border-radius: 50%; background: var(--glass); font-weight: bold; color: white; }
.btn-primary { background: var(--brand); color: black; padding: 16px; border-radius: 12px; font-weight: 800; width: 100%; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 15px rgba(0,255,204,0.4); transition: 0.2s; }
.btn-primary:hover { background: var(--brand-hover); box-shadow: 0 0 25px rgba(0,255,204,0.6); }
.btn-primary:disabled { opacity: 0.3; box-shadow: none; cursor: not-allowed; }

/* Tablas y Listados */
.table-container { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; backdrop-filter: blur(10px); }
table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: 16px 20px; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
td { font-size: 14px; }
.action-btn { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; background: var(--glass); border: 1px solid var(--border); margin-right: 4px; color: white; transition: 0.2s; }
.action-btn:hover { background: var(--brand); color: black; }
.action-btn.del:hover { background: var(--accent); color: white; }

/* Modales (Pop-ups) */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); display: grid; place-items: center; z-index: 100; padding: 20px; opacity: 0; pointer-events: none; transition: 0.3s; }
.modal-bg.show { opacity: 1; pointer-events: auto; }
.modal-box { background: #111; border: 1px solid var(--border); border-radius: 20px; padding: 32px; width: 100%; max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: scale(0.95); transition: 0.3s; max-height: 90vh; overflow-y: auto; }
.modal-bg.show .modal-box { transform: scale(1); }
.modal-box h2 { margin: 0 0 24px 0; color: var(--brand); font-family: 'Space Grotesk', sans-serif; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.lista-insumos { margin-bottom: 16px; max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: rgba(0,0,0,0.3); }
.insumo-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.insumo-row input, .insumo-row select { margin-bottom: 0; padding: 8px; }
.btn-add { background: var(--glass); border: 1px solid var(--brand); color: var(--brand); padding: 8px 16px; border-radius: 8px; font-weight: bold; margin-bottom: 16px; width: 100%;}
.btn-remove { background: var(--accent); color: white; padding: 8px; border-radius: 8px; }

/* Login */
.login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: grid; place-items: center; }
.login-box { background: var(--panel); border: 1px solid var(--border); padding: 48px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 0 50px rgba(0,255,204,0.1); }
.login-box h1 { font-family: 'Space Grotesk', sans-serif; color: var(--brand); text-align: center; margin-bottom: 32px; font-size: 32px; text-shadow: 0 0 20px rgba(0,255,204,0.4); }
.hide { display: none !important; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>TURIN OS</h1>
    <input id="email" type="email" placeholder="Correo">
    <input id="password" type="password" placeholder="Contraseña">
    <p id="loginError" style="color: var(--accent); font-size: 13px; display: none; text-align: center;">Credenciales incorrectas</p>
    <button id="btnLogin" class="btn-primary" style="margin-top: 16px;">Acceder al Sistema</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide" style="display: flex; width: 100%;">
  <aside class="sidebar">
    <div class="logo">TURIN.OS</div>
    
    <!-- Menús Cajero -->
    <button class="nav-btn active" data-view="pos"><span>🛒</span> Venta</button>
    <button class="nav-btn" data-view="caja"><span>💰</span> Mi Caja</button>
    <button class="nav-btn" data-view="reportes"><span>📊</span> Reportes</button>

    <!-- Menús Admin (Ocultos por defecto) -->
    <div id="admin-menu" class="hide" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
      <div style="font-size: 11px; color: var(--muted); font-weight: bold; margin-bottom: 12px; padding-left: 16px;">ADMINISTRACIÓN</div>
      <button class="nav-btn" data-view="admin-productos"><span>☕</span> Productos</button>
      <button class="nav-btn" data-view="admin-insumos"><span>📦</span> Insumos</button>
      <button class="nav-btn" data-view="admin-usuarios"><span>👥</span> Usuarios</button>
      <button class="nav-btn" data-view="admin-clientes"><span>🪪</span> Clientes</button>
    </div>

    <button id="btnLogout" class="nav-btn" style="margin-top: auto; color: var(--accent);"><span>🚪</span> Salir</button>
  </aside>

  <div class="main">
    <header>
      <h1 id="viewTitle">Punto de Venta</h1>
      <div class="user-badge" id="userName">Cargando...</div>
    </header>

    <div class="content">
      <!-- VISTA POS -->
      <div class="pos-container" id="view-pos">
        <div>
          <div class="grid" id="productsGrid"></div>
        </div>
        <div class="cart-area">
          <div style="padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;">
            <h3 style="margin:0;">Comanda</h3>
            <button id="btnClear" style="color: var(--accent); font-size: 12px; font-weight: bold;">Limpiar</button>
          </div>
          <div class="cart-items" id="cartItems"><p style="color: var(--muted); text-align: center; margin-top: 40px;">Sin productos</p></div>
          <div style="padding: 20px; border-top: 1px solid var(--border);">
            <div style="display: flex; justify-content: space-between; font-size: 24px; font-weight: 800; margin-bottom: 20px; font-family: 'Space Grotesk', sans-serif;">
              <span>Total</span><span id="cartTotal" style="color: var(--brand);">S/ 0.00</span>
            </div>
            <button class="btn-primary" id="btnPay" disabled>Procesar Pago</button>
          </div>
        </div>
      </div>

      <!-- VISTA CAJA -->
      <div id="view-caja" class="hide">
        <div class="table-container" style="padding: 32px; max-width: 600px; margin: 0 auto;">
          <h2 style="text-align: center; margin-bottom: 24px;">Control de Turno</h2>
          <div id="cajaContent"></div>
        </div>
      </div>

      <!-- VISTA REPORTES -->
      <div id="view-reportes" class="hide">
        <div class="table-container" style="padding: 24px; margin-bottom: 24px;">
          <div class="form-row">
            <div><label style="color: var(--muted); font-size: 12px;">Desde</label><input type="date" id="rep_desde"></div>
            <div><label style="color: var(--muted); font-size: 12px;">Hasta</label><input type="date" id="rep_hasta"></div>
          </div>
          <button class="btn-primary" onclick="filtrarReportes()">Buscar Ventas</button>
        </div>
        <div class="table-container" id="rep_tabla"></div>
      </div>

      <!-- VISTAS ADMIN -->
      <div id="view-admin-insumos" class="hide">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
          <input type="text" id="search_insumos" placeholder="Buscar insumo..." style="max-width: 300px; margin: 0;">
          <button class="btn-primary" style="width: auto; padding: 12px 24px;" onclick="abrirModalInsumo()">+ Nuevo Insumo</button>
        </div>
        <div class="table-container" id="tabla_insumos"></div>
      </div>

      <div id="view-admin-productos" class="hide">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
          <input type="text" id="search_productos" placeholder="Buscar producto..." style="max-width: 300px; margin: 0;">
          <button class="btn-primary" style="width: auto; padding: 12px 24px;" onclick="abrirModalProducto()">+ Nuevo Producto</button>
        </div>
        <div class="table-container" id="tabla_productos"></div>
      </div>

    </div>
  </div>
</div>

<!-- MODALES -->
<div id="modal" class="modal-bg">
  <div class="modal-box" id="modalContent"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ==========================================
  // PEGA AQUÍ TUS CREDENCIALES
  // ==========================================
  const SUPABASE_URL = 'https://gjllfpeoiwctciuqifnt.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqbGxmcGVvaXdjdGNpdXFpZm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODUyNjEsImV4cCI6MjEwODg2MTI2MX0.oAy09RwLboczMa_PxdqGrTwV4YdSfg5axxYA8XbzxsA';
  // ==========================================

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let userPerfil = null;
  let productos = [], insumos = [], categorias = [], carrito = [], turnoActual = null;
  let clientes = [], usuarios = [];

  const $ = s => document.querySelector(s);
  const money = n => 'S/ ' + Number(n).toFixed(2);
  
  // LOGIN
  $('#btnLogin').onclick = async () => {
    const { data, error } = await db.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#password').value });
    if (error) { $('#loginError').style.display = 'block'; } 
    else { initApp(data.user); }
  };

  async function initApp(authUser) {
    const { data: perfil } = await db.from('perfiles').select('*').eq('id', authUser.id).single();
    userPerfil = perfil;
    
    $('#loginScreen').classList.add('hide');
    $('#app').classList.remove('hide');
    $('#userName').textContent = `${perfil.nombre} (${perfil.rol})`;

    if (perfil.rol === 'Administrador') {
      $('#admin-menu').classList.remove('hide');
    }

    await cargarTodo();
    verificarTurno();
    navegar('pos');
  }

  async function cargarTodo() {
    const [resProd, resIns, resCat, resCli, resUsu] = await Promise.all([
      db.from('productos').select('*'),
      db.from('insumos').select('*'),
      db.from('categorias').select('*'),
      db.from('clientes').select('*'),
      db.from('perfiles').select('*')
    ]);
    productos = resProd.data || []; insumos = resIns.data || []; categorias = resCat.data || [];
    clientes = resCli.data || []; usuarios = resUsu.data || [];
    renderPOS();
  }

  // NAVEGACIÓN
  document.querySelectorAll('.nav-btn[data-view]').forEach(btn => {
    btn.onclick = () => navegar(btn.dataset.view);
  });

  function navegar(view) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.nav-btn[data-view="${view}"]`)?.classList.add('active');
    
    ['pos', 'caja', 'reportes', 'admin-insumos', 'admin-productos'].forEach(v => {
      $(`#view-${v}`)?.classList.add('hide');
    });
    $(`#view-${view}`)?.classList.remove('hide');

    if (view === 'pos') $('#viewTitle').textContent = 'Punto de Venta';
    if (view === 'caja') { $('#viewTitle').textContent = 'Mi Caja'; renderCaja(); }
    if (view === 'reportes') { $('#viewTitle').textContent = 'Reportes de Ventas'; }
    if (view === 'admin-insumos') { $('#viewTitle').textContent = 'Gestión de Insumos'; renderTablaInsumos(); }
    if (view === 'admin-productos') { $('#viewTitle').textContent = 'Gestión de Productos'; renderTablaProductos(); }
  }

  // --- POS LOGIC ---
  function renderPOS() {
    $('#productsGrid').innerHTML = productos.map(p => `
      <button class="card-prod" onclick="agregarAlCarrito('${p.id}')">
        <h3>${p.nombre}</h3><span class="price">${money(p.precio)}</span>
      </button>
    `).join('');
  }

  window.agregarAlCarrito = (id) => {
    const prod = productos.find(p => p.id === id);
    const item = carrito.find(i => i.producto_id === id);
    if (item) item.cantidad++;
    else carrito.push({ producto_id: id, nombre: prod.nombre, precio: prod.precio, cantidad: 1 });
    renderCarrito();
  };

  window.cambiarCantidad = (id, delta) => {
    const item = carrito.find(i => i.producto_id === id);
    if (item) { item.cantidad += delta; if (item.cantidad <= 0) carrito = carrito.filter(i => i.producto_id !== id); renderCarrito(); }
  };

  function renderCarrito() {
    if (carrito.length === 0) {
      $('#cartItems').innerHTML = '<p style="color: var(--muted); text-align: center; margin-top: 40px;">Sin productos</p>';
      $('#cartTotal').textContent = 'S/ 0.00'; $('#btnPay').disabled = true; return;
    }
    $('#cartItems').innerHTML = carrito.map(i => `
      <div class="cart-item">
        <div><h4 style="margin:0 0 4px 0;">${i.nombre}</h4><span style="color: var(--muted); font-size:12px;">${money(i.precio)}</span></div>
        <div class="qty-controls">
          <button onclick="cambiarCantidad('${i.producto_id}', -1)">-</button>
          <span>${i.cantidad}</span>
          <button onclick="cambiarCantidad('${i.producto_id}', 1)">+</button>
        </div>
      </div>
    `).join('');
    $('#cartTotal').textContent = money(carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0));
    $('#btnPay').disabled = false;
  }

  $('#btnClear').onclick = () => { carrito = []; renderCarrito(); };

  // PAGO
  $('#btnPay').onclick = async () => {
    if (!turnoActual) return alert('Debes abrir tu caja antes de vender.');
    const total = carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0);
    
    abrirModal(`
      <h2>Cobrar Venta</h2>
      <p style="font-size: 32px; font-weight: 800; text-align: center; color: var(--brand); margin: 20px 0;">${money(total)}</p>
      <label>Método de Pago</label>
      <select id="pay_method">
        <option value="Efectivo">Efectivo</option>
        <option value="Yape">Yape</option>
        <option value="Plin">Plin</option>
        <option value="Tarjeta">Tarjeta</option>
      </select>
      <button class="btn-primary" onclick="procesarPago('${turnoActual.id}', ${total})">Confirmar Pago</button>
    `);
  };

  window.procesarPago = async (turnoId, total) => {
    const metodo = $('#pay_method').value;
    const carritoJSON = carrito.map(i => ({ producto_id: i.producto_id, cantidad: i.cantidad }));
    
    const { error } = await db.rpc('registrar_venta', {
      p_carrito: carritoJSON, p_metodo_pago: metodo, p_monto_pagado: total, p_turno_id: turnoId
    });

    if (error) return alert(error.message);
    
    cerrarModal();
    carrito = []; renderCarrito();
    await cargarTodo(); // Recarga inventario
    alert('Venta registrada y stock actualizado');
  };

  // --- CAJA LOGIC ---
  async function verificarTurno() {
    const { data } = await db.from('turnos').select('*').eq('estado', 'Abierto').order('fecha_apertura', { ascending: false }).limit(1);
    turnoActual = data && data.length > 0 ? data[0] : null;
  }

  function renderCaja() {
    if (!turnoActual) {
      $('#cajaContent').innerHTML = `
        <p style="text-align: center; color: var(--muted); margin-bottom: 20px;">No tienes un turno abierto.</p>
        <input type="number" id="monto_apertura" placeholder="Monto inicial en efectivo (S/)">
        <button class="btn-primary" onclick="abrirCaja()">Abrir Turno</button>
      `;
    } else {
      $('#cajaContent').innerHTML = `
        <div style="text-align: center; margin-bottom: 24px; padding: 16px; background: rgba(0,255,204,0.1); border-radius: 12px; border: 1px solid var(--brand);">
          <h3 style="color: var(--brand); margin: 0 0 8px 0;">Turno Abierto</h3>
          <p style="margin: 0; color: var(--muted);">Desde: ${new Date(turnoActual.fecha_apertura).toLocaleString()}</p>
        </div>
        <input type="number" id="monto_cierre" placeholder="Efectivo contado al cerrar (S/)">
        <button class="btn-primary" style="background: var(--accent); box-shadow: 0 0 15px rgba(255,0,85,0.4);" onclick="cerrarCaja('${turnoActual.id}')">Cerrar Turno</button>
      `;
    }
  }

  window.abrirCaja = async () => {
    const monto = parseFloat($('#monto_apertura').value) || 0;
    const { error } = await db.rpc('abrir_caja', { p_monto: monto });
    if (error) return alert(error.message);
    await verificarTurno(); renderCaja(); alert('Caja abierta exitosamente');
  };

  window.cerrarCaja = async (id) => {
    const monto = parseFloat($('#monto_cierre').value) || 0;
    const { error } = await db.rpc('cerrar_caja', { p_turno_id: id, p_monto_contado: monto });
    if (error) return alert(error.message);
    await verificarTurno(); renderCaja(); alert('Caja cerrada exitosamente');
  };

  // --- ADMIN: INSUMOS ---
  function renderTablaInsumos() {
    const search = $('#search_insumos').value.toLowerCase();
    const filtrados = insumos.filter(i => i.nombre.toLowerCase().includes(search));
    $('#tabla_insumos').innerHTML = `
      <table>
        <tr><th>Nombre</th><th>Stock</th><th>Unidad</th><th>Acciones</th></tr>
        ${filtrados.map(i => `
          <tr>
            <td>${i.nombre}</td>
            <td style="color: ${i.stock_actual <= i.stock_minimo ? 'var(--accent)' : 'var(--brand)'}; font-weight: bold;">${i.stock_actual}</td>
            <td>${i.unidad}</td>
            <td>
              <button class="action-btn" onclick="editarInsumo('${i.id}')">Editar</button>
              <button class="action-btn del" onclick="eliminarInsumo('${i.id}')">Borrar</button>
            </td>
          </tr>
        `).join('')}
      </table>
    `;
  }
  $('#search_insumos').oninput = renderTablaInsumos;

  function abrirModalInsumo() {
    abrirModal(`
      <h2>Nuevo Insumo</h2>
      <input type="text" id="ins_nombre" placeholder="Nombre (Ej. Café en grano)">
      <input type="text" id="ins_unidad" placeholder="Unidad (g, ml, unidad)">
      <div class="form-row">
        <input type="number" id="ins_stock" placeholder="Stock Inicial">
        <input type="number" id="ins_min" placeholder="Stock Mínimo">
      </div>
      <button class="btn-primary" onclick="guardarInsumo()">Guardar</button>
    `);
  }

  window.guardarInsumo = async () => {
    const nombre = $('#ins_nombre').value;
    const unidad = $('#ins_unidad').value;
    const stock = parseFloat($('#ins_stock').value) || 0;
    const min = parseFloat($('#ins_min').value) || 0;
    if (!nombre || !unidad) return alert('Completa los campos');

    const { error } = await db.from('insumos').insert([{ nombre, unidad, stock_inicial: stock, stock_actual: stock, stock_minimo: min }]);
    if (error) return alert(error.message);
    
    cerrarModal(); await cargarTodo(); renderTablaInsumos(); alert('Insumo creado');
  };

  // --- ADMIN: PRODUCTOS ---
  function renderTablaProductos() {
    const search = $('#search_productos').value.toLowerCase();
    const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(search));
    $('#tabla_productos').innerHTML = `
      <table>
        <tr><th>Nombre</th><th>Precio</th><th>Acciones</th></tr>
        ${filtrados.map(p => `
          <tr>
            <td>${p.nombre}</td>
            <td>${money(p.precio)}</td>
            <td>
              <button class="action-btn" onclick="editarProducto('${p.id}')">Editar</button>
              <button class="action-btn del" onclick="eliminarProducto('${p.id}')">Borrar</button>
            </td>
          </tr>
        `).join('')}
      </table>
    `;
  }
  $('#search_productos').oninput = renderTablaProductos;

  function abrirModalProducto() {
    abrirModal(`
      <h2>Nuevo Producto y Receta</h2>
      <input type="text" id="prod_nombre" placeholder="Nombre del producto">
      <input type="number" id="prod_precio" placeholder="Precio de venta (S/)">
      
      <label style="color: var(--muted); font-size: 12px; margin-top: 16px; display: block;">Receta (Obligatorio)</label>
      <div class="lista-insumos" id="lista_receta"></div>
      
      <button class="btn-add" onclick="agregarFilaReceta()">+ Agregar Insumo a la Receta</button>
      
      <div id="nuevo_insumo_box" class="hide" style="background: rgba(0,0,0,0.5); padding: 16px; border-radius: 12px; margin-bottom: 16px; border: 1px dashed var(--border);">
        <p style="margin: 0 0 12px 0; font-size: 12px; color: var(--brand);">Crear nuevo insumo rápido:</p>
        <input type="text" id="new_ins_nombre" placeholder="Nombre">
        <div class="form-row">
          <input type="text" id="new_ins_unidad" placeholder="Unidad (g, ml)">
          <input type="number" id="new_ins_stock" placeholder="Stock Inicial">
        </div>
        <button class="btn-primary" style="padding: 8px;" onclick="crearInsumoRapido()">Guardar Insumo</button>
      </div>

      <button class="btn-primary" onclick="guardarProducto()">Guardar Todo</button>
    `);
    agregarFilaReceta(); // Iniciar con 1 fila
  }

  window.agregarFilaReceta = () => {
    const div = document.createElement('div');
    div.className = 'insumo-row';
    div.innerHTML = `
      <select class="rec_ins" style="flex:2;">
        <option value="">Seleccionar...</option>
        <option value="nuevo" style="color: var(--brand); font-weight: bold;">+ Crear NUEVO insumo</option>
        ${insumos.map(i => `<option value="${i.id}">${i.nombre} (${i.unidad})</option>`).join('')}
      </select>
      <input type="number" class="rec_qty" placeholder="Cant." style="flex:1;">
      <button class="btn-remove" onclick="this.parentElement.remove()">X</button>
    `;
    div.querySelector('.rec_ins').onchange = (e) => {
      if (e.target.value === 'nuevo') $('#nuevo_insumo_box').classList.remove('hide');
      else $('#nuevo_insumo_box').classList.add('hide');
    };
    $('#lista_receta').appendChild(div);
  };

  window.crearInsumoRapido = async () => {
    const nombre = $('#new_ins_nombre').value;
    const unidad = $('#new_ins_unidad').value;
    const stock = parseFloat($('#new_ins_stock').value) || 0;
    if (!nombre || !unidad) return alert('Llena los datos del insumo');

    const { data, error } = await db.from('insumos').insert([{ nombre, unidad, stock_inicial: stock, stock_actual: stock }]).select();
    if (error) return alert(error.message);

    await cargarTodo(); // Recargar insumos
    alert('Insumo creado y agregado a la lista');
    $('#nuevo_insumo_box').classList.add('hide');
    
    // Auto-seleccionar el nuevo insumo en el select que lo pidió
    const selects = document.querySelectorAll('.rec_ins');
    const lastSelect = selects[selects.length - 1];
    lastSelect.value = data[0].id;
  };

  window.guardarProducto = async () => {
    const nombre = $('#prod_nombre').value;
    const precio = parseFloat($('#prod_precio').value);
    if (!nombre || isNaN(precio)) return alert('Completa nombre y precio');

    const receta = [];
    document.querySelectorAll('.insumo-row').forEach(row => {
      const id = row.querySelector('.rec_ins').value;
      const qty = parseFloat(row.querySelector('.rec_qty').value);
      if (id && id !== 'nuevo' && qty > 0) receta.push({ insumo_id: id, cantidad: qty });
    });

    if (receta.length === 0) return alert('El producto debe tener al menos un insumo en su receta');

    // Guardar Producto
    const { data: prod, error: prodErr } = await db.from('productos').insert([{ nombre, precio, categoria_id: categorias[0]?.id }]).select();
    if (prodErr) return alert(prodErr.message);

    // Guardar Receta
    const recetaData = receta.map(r => ({ producto_id: prod[0].id, insumo_id: r.insumo_id, cantidad: r.cantidad }));
    const { error: recErr } = await db.from('recetas').insert(recetaData);
    if (recErr) return alert(recErr.message);

    cerrarModal(); await cargarTodo(); renderTablaProductos(); alert('Producto y receta guardados');
  };

  // UTILS
  function abrirModal(html) {
    $('#modalContent').innerHTML = html;
    $('#modal').classList.add('show');
  }
  function cerrarModal() { $('#modal').classList.remove('show'); }

  $('#btnLogout').onclick = async () => { await db.auth.signOut(); location.reload(); };

  db.auth.getSession().then(({ data }) => { if (data.session) initApp(data.session.user); });
</script>
</body>
</html>
